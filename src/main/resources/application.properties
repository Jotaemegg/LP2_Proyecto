# Puerto del servidor web local (para evitar colisiones con el puerto 8080 por defecto)
server.port=8090

# Configuración de la conexión a la Base de Datos MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_cafeorigen?createDatabaseIfNotExist=true
spring.datasource.username=root
# Si tu base de datos local de MySQL tiene contraseña (ej: 'root' o '123456'), colócala aquí.
# Si estás usando XAMPP o WAMP sin contraseña por defecto, déjalo vacío.
spring.datasource.password=mysql

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Desactivar la caché de Thymeleaf para reflejar cambios en HTML en caliente durante desarrollo
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
