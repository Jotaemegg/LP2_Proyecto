<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Origen - Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4A3B32 0%, #2A2421 100%);
            padding: 2rem 0;
        }
        .register-container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-section h2 {
            font-size: 1.8rem;
            color: #6F4E37;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin: 0;
            text-decoration: none;
        }
        .logo-section p {
            color: #7E726B;
            font-size: 0.9rem;
            margin-top: 0.35rem;
            text-decoration: none;
        }
        .btn-volver-login,
        .btn-volver-login:link,
        .btn-volver-login:visited,
        .btn-volver-login:hover {
            text-decoration: none !important;
            color: inherit;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div style="margin-bottom: 1rem;">
            <a th:href="@{/login}" class="btn btn-secondary btn-sm btn-volver-login">← Volver al inicio de sesión</a>
        </div>
        <div class="logo-section">
            <h2>CAFÉ ORIGEN</h2>
            <p>Registro de Nuevo Cliente</p>
        </div>

        <!-- Alertas de Error/Mensajes -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

        <form th:action="@{/registro}" method="post">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" th:value="${nombre}" class="form-control" placeholder="Ej. Juan Pérez Torres" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dni">DNI / Documento</label>
                    <input type="text" id="dni" name="dni" th:value="${dni}" class="form-control" placeholder="8 dígitos" pattern="[0-9]{8,15}" title="Ingrese un DNI válido (mínimo 8 dígitos)" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" name="telefono" th:value="${telefono}" class="form-control" placeholder="Ej. 987654321" required>
                </div>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección Domiciliaria</label>
                <input type="text" id="direccion" name="direccion" th:value="${direccion}" class="form-control" placeholder="Ej. Av. Larco 123, Miraflores" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" th:value="${email}" class="form-control" placeholder="juan.perez@gmail.com" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
                Crear mi Cuenta
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.2rem;">
            <a th:href="@{/login}" style="color: #6F4E37; font-weight: 600; text-decoration: none; font-size: 0.9rem; transition: color 0.3s;" onmouseover="this.style.color='#C0A080'" onmouseout="this.style.color='#6F4E37'">
                ¿Ya tienes cuenta? Inicia sesión aquí
            </a>
        </div>
    </div>

</body>
</html>
