<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <th:block th:fragment="navbarStyles"></th:block>

    <header th:fragment="headerAutenticado">
        <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
            <div class="container-fluid px-3 px-lg-4">
                <a th:href="@{/dashboard}" class="navbar-brand d-flex align-items-center gap-2" title="Ir al inicio">
                    <span class="brand-mark">
                        <img th:src="@{/img/logo.jpeg}" alt="Café Origen" class="brand-logo">
                    </span>
                    <span class="brand-title">CAFÉ ORIGEN <span class="brand-legal">S.A.C.</span></span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
                        aria-controls="navMain" aria-expanded="false" aria-label="Alternar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navMain">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-2 gap-lg-3 mt-3 mt-lg-0">
                        <li class="nav-item">
                            <span th:text="${'Hola, ' + usuario.nombre + ' (' + usuario.rol.nombre + ')'}" class="nav-user"></span>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/dashboard}" class="nav-link"><i class="bi bi-house-door me-1"></i>Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/logout}" class="btn btn-logout"><i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div th:fragment="cardTop(volverUrl)" class="card-top">
        <a th:href="${volverUrl}" class="btn-volver btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>

</body>
</html>
