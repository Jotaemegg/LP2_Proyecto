<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Café Origen - Mantenimiento de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=5)}">
    <link rel="icon" type="image/jpeg" th:href="@{/img/logo.jpeg}">
    <th:block th:replace="~{fragments/navegacion :: navbarStyles}"></th:block>
</head>
<body>

    <header th:replace="~{fragments/navegacion :: headerAutenticado}"></header>

    <div class="container app-container py-4">

        <div th:replace="~{fragments/navegacion :: cardTop(@{/dashboard})}"></div>

        <div class="row g-4">

            <div class="col-lg-5">
                <div class="card">
                    <h2 class="card-title">
                        <i class="bi bi-person-badge me-2"></i>
                        <span th:text="${empleado.idEmpleado == null ? 'Registrar Empleado' : 'Modificar Empleado'}">Registrar Empleado</span>
                    </h2>

                    <div th:if="${mensaje}" th:class="${cssmensaje}" th:text="${mensaje}"></div>

                    <form th:action="@{/empleados/grabar}" th:object="${empleado}" method="post">

                        <input type="hidden" th:field="*{idEmpleado}">

                        <h3 class="h6 text-cafe fw-bold border-bottom pb-1 mb-3">Datos del Personal</h3>

                        <div class="form-group">
                            <label for="nombre" class="form-label">Nombre Completo</label>
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                                   placeholder="Ej. Juan Pérez" required autocomplete="off">
                        </div>

                        <div class="row">
                            <div class="col-7 form-group">
                                <label for="cargo" class="form-label">Cargo</label>
                                <select id="cargo" th:field="*{cargo}" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option value="Gerente General">Gerente General</option>
                                    <option value="Administrador">Administrador</option>
                                    <option value="Recepcionista">Recepcionista</option>
                                    <option value="Barista Principal">Barista Principal</option>
                                    <option value="Barista">Barista</option>
                                </select>
                            </div>
                            <div class="col-5 form-group">
                                <label for="sueldo" class="form-label">Sueldo (S/)</label>
                                <input type="number" step="0.01" min="0" id="sueldo" th:field="*{sueldo}"
                                       class="form-control" placeholder="0.00" required>
                            </div>
                        </div>

                        <h3 class="h6 text-cafe fw-bold border-bottom pb-1 mb-3 mt-2">Credenciales de Acceso</h3>

                        <div class="form-group">
                            <label for="email" class="form-label">Correo (Usuario)</label>
                            <input type="email" id="email" name="email" class="form-control"
                                   th:value="${empleado.usuario != null ? empleado.usuario.email : ''}"
                                   placeholder="usuario@cafeorigen.pe" required autocomplete="off">
                        </div>

                        <div class="row">
                            <div class="col-6 form-group">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="text" id="password" name="password" class="form-control"
                                       th:value="${empleado.usuario != null ? empleado.usuario.password : ''}"
                                       placeholder="Contraseña" required>
                            </div>
                            <div class="col-6 form-group">
                                <label for="idRol" class="form-label">Rol del Sistema</label>
                                <select id="idRol" name="idRol" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option th:each="r : ${lstRoles}"
                                            th:value="${r.idRol}"
                                            th:text="${r.nombre}"
                                            th:selected="${empleado.usuario != null && empleado.usuario.rol != null && empleado.usuario.rol.idRol == r.idRol}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-save me-1"></i>Guardar
                            </button>
                            <a th:href="@{/empleados}" class="btn btn-secondary flex-fill text-center">
                                <i class="bi bi-plus-lg me-1"></i>Nuevo
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card">
                    <h2 class="card-title"><i class="bi bi-people-fill me-2"></i>Personal Registrado</h2>

                    <form th:action="@{/empleados}" method="get" class="d-flex gap-2 mb-3">
                        <input type="text" name="buscar" th:value="${buscar}" class="form-control" placeholder="Buscar empleado por nombre...">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
                        <a th:href="@{/empleados}" class="btn btn-secondary">Limpiar</a>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Cargo</th>
                                    <th>Sueldo</th>
                                    <th>Correo</th>
                                    <th>Rol</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="emp : ${lstEmpleados}">
                                    <td th:text="${emp.idEmpleado}">1</td>
                                    <td th:text="${emp.nombre}" style="font-weight: 600;">Juan Pérez</td>
                                    <td th:text="${emp.cargo}">Barista</td>
                                    <td th:text="${'S/ ' + #numbers.formatDecimal(emp.sueldo, 1, 2)}">S/ 0.00</td>
                                    <td th:text="${emp.usuario.email}">correo</td>
                                    <td>
                                        <span class="badge"
                                              th:text="${emp.usuario.rol.nombre}"
                                              th:classappend="${emp.usuario.rol.nombre == 'ADMINISTRADOR' ? 'badge-ocupado' : 'badge-disponible'}">ROL</span>
                                    </td>
                                    <td>
                                        <div class="d-flex flex-wrap gap-2">
                                            <a th:href="@{/empleados/editar/{id}(id=${emp.idEmpleado})}" class="btn btn-secondary btn-sm">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:href="@{/empleados/eliminar/{id}(id=${emp.idEmpleado})}" class="btn btn-danger btn-sm"
                                               onclick="return confirm('¿Dar de baja a este empleado y su cuenta de acceso?')">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(lstEmpleados)}">
                                    <td colspan="7" class="text-center text-cafe-muted">No hay empleados registrados.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
