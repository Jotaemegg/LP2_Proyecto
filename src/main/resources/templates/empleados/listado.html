<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Origen - Gestión de Empleados</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
    <th:block th:replace="~{fragments/navegacion :: navbarStyles}"></th:block>
</head>
<body>

    <header th:replace="~{fragments/navegacion :: headerAutenticado}"></header>

    <div class="container">
        
        <div class="card">
            <div th:replace="~{fragments/navegacion :: cardTop(@{/dashboard})}"></div>
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--secondary-color); padding-bottom: 0.5rem; margin-bottom: 1.5rem;">
                <h2 style="font-size: 1.5rem; color: var(--primary-color); margin: 0;">Gestión de Personal / Empleados</h2>
                <a th:href="@{/empleados/nuevo}" class="btn btn-primary btn-sm">+ Registrar Empleado</a>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre Completo</th>
                            <th>Cargo</th>
                            <th>Sueldo</th>
                            <th>Fecha de Contratación</th>
                            <th>Correo / Usuario</th>
                            <th>Rol de Acceso</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="emp : ${empleados}">
                            <td th:text="${emp.idEmpleado}">1</td>
                            <td th:text="${emp.nombre}" style="font-weight: 600;">Juan Pérez</td>
                            <td th:text="${emp.cargo}">Barista</td>
                            <td th:text="${'S/ ' + #numbers.formatDecimal(emp.sueldo, 1, 2)}">S/ 1500.00</td>
                            <td th:text="${#temporals.format(emp.fechaContratacion, 'dd/MM/yyyy')}">15/01/2025</td>
                            <td th:text="${emp.usuario.email}">juan@cafeorigen.pe</td>
                            <td>
                                <span class="badge" 
                                      th:text="${emp.usuario.rol.nombre}"
                                      th:classappend="${emp.usuario.rol.nombre == 'ADMINISTRADOR' ? 'badge-ocupado' : 'badge-disponible'}">
                                </span>
                            </td>
                            <td style="text-align: center; white-space: nowrap;">
                                <a th:href="@{/empleados/editar/{id}(id=${emp.idEmpleado})}" class="btn btn-secondary btn-sm" style="margin-right: 0.5rem;">Editar</a>
                                <a th:href="@{/empleados/eliminar/{id}(id=${emp.idEmpleado})}" class="btn btn-danger btn-sm" 
                                   onclick="return confirm('¿Está seguro de que desea eliminar a este empleado? Esta acción también eliminará su cuenta de usuario vinculada.')">Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(empleados)}">
                            <td colspan="8" style="text-align: center; color: var(--text-muted);">No hay empleados registrados en el sistema.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div style="margin-top: 1.5rem;">
                <a th:href="@{/dashboard}" class="btn btn-secondary">Regresar al Panel</a>
            </div>
        </div>

    </div>

</body>
</html>
