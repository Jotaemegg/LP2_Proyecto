<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Origen - Formulario de Empleado</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header>
        <h1>CAFÉ ORIGEN S.A.C.</h1>
        <nav>
            <span th:text="${'Hola, ' + usuario.nombre + ' (' + usuario.rol.nombre + ')'}" style="font-weight: bold; color: var(--secondary-color);"></span>
            <a th:href="@{/dashboard}">Inicio</a>
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        
        <div class="card" style="max-width: 600px; margin: 2rem auto;">
            <h2 class="card-title" th:text="${empleado.idEmpleado == null ? 'Registrar Nuevo Empleado' : 'Editar Empleado'}">Registrar Empleado</h2>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/empleados/guardar}" th:object="${empleado}" method="post">
                <!-- ID de Empleado oculto para saber si es edición -->
                <input type="hidden" th:field="*{idEmpleado}">

                <h3 style="font-size: 1.1rem; color: var(--primary-color); margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.25rem;">
                    Datos Personales
                </h3>

                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Ej. Juan Pérez" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="cargo">Cargo / Puesto</label>
                        <select id="cargo" th:field="*{cargo}" class="form-control" required>
                            <option value="">Seleccione...</option>
                            <option value="Gerente General">Gerente General</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Recepcionista">Recepcionista</option>
                            <option value="Barista Principal">Barista Principal</option>
                            <option value="Barista">Barista</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="sueldo">Sueldo Mensual (S/)</label>
                        <input type="number" id="sueldo" th:field="*{sueldo}" class="form-control" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>

                <h3 style="font-size: 1.1rem; color: var(--primary-color); margin-top: 1.5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.25rem;">
                    Credenciales de Acceso al Sistema
                </h3>

                <div class="form-group">
                    <label for="email">Correo Electrónico (Usuario)</label>
                    <input type="email" id="email" name="email" class="form-control" 
                           th:value="${empleado.usuario != null ? empleado.usuario.email : ''}" 
                           placeholder="usuario@cafeorigen.pe" required autocomplete="off">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="text" id="password" name="password" class="form-control" 
                               th:value="${empleado.usuario != null ? empleado.usuario.password : ''}" 
                               placeholder="Contraseña" required>
                    </div>

                    <div class="form-group">
                        <label for="idRol">Rol del Sistema</label>
                        <select id="idRol" name="idRol" class="form-control" required>
                            <option value="">Seleccione Rol...</option>
                            <option th:each="r : ${roles}" 
                                    th:value="${r.idRol}" 
                                    th:text="${r.nombre}" 
                                    th:selected="${empleado.usuario != null && empleado.usuario.rol.idRol == r.idRol}"></option>
                        </select>
                    </div>
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar Cambios</button>
                    <a th:href="@{/empleados}" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancelar</a>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
