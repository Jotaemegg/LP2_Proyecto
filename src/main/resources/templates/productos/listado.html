<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Origen - Cafés y Productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
    <th:block th:replace="~{fragments/navegacion :: navbarStyles}"></th:block>
    <style>
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #F5F5F0;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }
        .filter-form {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .filter-form select {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: white;
            outline: none;
        }
    </style>
</head>
<body>

    <header th:replace="~{fragments/navegacion :: headerAutenticado}"></header>

    <div class="container">
        
        <div class="card">
            <div th:replace="~{fragments/navegacion :: cardTop(@{/dashboard})}"></div>
            <h2 class="card-title">Mantenimiento y Catálogo de Cafetería</h2>
            
            <div class="filter-bar">
                <form th:action="@{/productos}" method="get" class="filter-form">
                    <label for="categoria" style="font-weight: bold; color: var(--text-dark);">Filtrar por Categoría:</label>
                    <select id="categoria" name="categoria" onchange="this.form.submit()">
                        <option value="Todas" th:selected="${categoriaSeleccionada == null || categoriaSeleccionada == 'Todas'}">Todas las categorías</option>
                        <option value="Bebidas Calientes" th:selected="${categoriaSeleccionada == 'Bebidas Calientes'}">Bebidas Calientes</option>
                        <option value="Bebidas Frías" th:selected="${categoriaSeleccionada == 'Bebidas Frías'}">Bebidas Frías</option>
                        <option value="Café en Grano" th:selected="${categoriaSeleccionada == 'Café en Grano'}">Café en Grano</option>
                        <option value="Postres" th:selected="${categoriaSeleccionada == 'Postres'}">Postres</option>
                    </select>
                </form>

                
                <a th:if="${usuario.rol.nombre == 'ADMINISTRADOR'}" th:href="@{/productos/nuevo}" class="btn btn-primary">
                    + Nuevo Producto
                </a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio Unitario</th>
                        <th>Stock Actual</th>
                        <th th:if="${usuario.rol.nombre == 'ADMINISTRADOR'}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prod : ${productos}">
                        <td th:text="${prod.idProducto}"></td>
                        <td th:text="${prod.nombre}" style="font-weight: bold; color: var(--primary-color);"></td>
                        <td th:text="${prod.categoria}"></td>
                        <td th:text="${'S/ ' + #numbers.formatDecimal(prod.precio, 1, 2)}"></td>
                        <td>
                            <span th:text="${prod.stock}" th:classappend="${prod.stock <= 5 ? 'badge-ocupado badge' : 'badge-disponible badge'}"></span>
                        </td>
                        <td th:if="${usuario.rol.nombre == 'ADMINISTRADOR'}">
                            <a th:href="@{/productos/editar/{id}(id=${prod.idProducto})}" class="btn btn-secondary btn-sm" style="margin-right: 0.5rem;">Editar</a>
                            <a th:href="@{/productos/eliminar/{id}(id=${prod.idProducto})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Está seguro de eliminar este producto del catálogo?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>
</html>
