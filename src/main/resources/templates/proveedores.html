<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Café Origen - Mantenimiento de Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=5)}">
    <link rel="icon" type="image/jpeg" th:href="@{/img/logo.jpeg}">
    <th:block th:replace="~{fragments/navegacion :: navbarStyles}"></th:block>
</head>
<body>

    <header th:replace="~{fragments/navegacion :: headerAutenticado}"></header>

    <div class="container app-container py-4">

        <div th:replace="~{fragments/navegacion :: cardTop(@{/dashboard})}"></div>

        <div class="row g-4">

            <div class="col-lg-5">
                <div class="card">
                    <h2 class="card-title">
                        <i class="bi bi-truck me-2"></i>
                        <span th:text="${proveedor.idProveedor == null ? 'Registrar Proveedor' : 'Modificar Proveedor'}">Registrar Proveedor</span>
                    </h2>

                    <div th:if="${mensaje}" th:class="${cssmensaje}" th:text="${mensaje}"></div>

                    <form th:action="@{/proveedores/grabar}" th:object="${proveedor}" method="post">
                        <input type="hidden" th:field="*{idProveedor}">
                        <input type="hidden" th:field="*{estado}">

                        <div class="form-group">
                            <label for="razonSocial" class="form-label">Razón Social</label>
                            <input type="text" id="razonSocial" th:field="*{razonSocial}" class="form-control"
                                   placeholder="Ej: Cafés del Valle S.A.C." required autocomplete="off">
                        </div>

                        <div class="form-group">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text" id="telefono" th:field="*{telefono}" class="form-control"
                                   placeholder="Ej: 987111222">
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">Correo</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   placeholder="Ej: ventas@proveedor.pe" autocomplete="off">
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-save me-1"></i>Guardar
                            </button>
                            <a th:href="@{/proveedores}" class="btn btn-secondary flex-fill text-center">
                                <i class="bi bi-plus-lg me-1"></i>Nuevo
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card">
                    <h2 class="card-title"><i class="bi bi-list-ul me-2"></i>Proveedores Registrados</h2>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Razón Social</th>
                                    <th>Teléfono</th>
                                    <th>Correo</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="prov : ${lstProveedores}">
                                    <td th:text="${prov.idProveedor}">1</td>
                                    <td th:text="${prov.razonSocial}" style="font-weight: 600; color: var(--primary-color);">Proveedor</td>
                                    <td th:text="${prov.telefono}">999</td>
                                    <td th:text="${prov.email}">correo</td>
                                    <td>
                                        <div class="d-flex flex-wrap gap-2">
                                            <a th:href="@{/proveedores/editar/{id}(id=${prov.idProveedor})}" class="btn btn-secondary btn-sm">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:href="@{/proveedores/eliminar/{id}(id=${prov.idProveedor})}" class="btn btn-danger btn-sm"
                                               onclick="return confirm('¿Dar de baja este proveedor?')">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(lstProveedores)}">
                                    <td colspan="5" class="text-center text-cafe-muted">No hay proveedores registrados.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
