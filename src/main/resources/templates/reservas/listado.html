<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Origen - Historial de Reservas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header>
        <h1>CAFÉ ORIGEN S.A.C.</h1>
        <nav>
            <span th:text="${'Hola, ' + usuario.nombre + ' (' + usuario.rol.nombre + ')'}" style="font-weight: bold; color: var(--secondary-color);"></span>
            <a th:href="@{/dashboard}">Inicio</a>
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 2px solid var(--secondary-color); padding-bottom: 0.5rem;">
                <h2 style="font-size: 1.5rem; color: var(--primary-color); border: none; padding: 0; margin: 0;">
                    Historial de Reservas y Alquileres
                </h2>
                <a th:href="@{/reservas/nueva}" class="btn btn-primary">
                    + Registrar Nueva Reserva & Consumo
                </a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Boleta N°</th>
                        <th>Cliente</th>
                        <th>Fecha de Registro</th>
                        <th>Total Cobrado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="res : ${reservas}">
                        <td th:text="${res.idReserva}"></td>
                        <td th:text="${res.cliente.nombre}" style="font-weight: bold;"></td>
                        <td th:text="${#temporals.format(res.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${'S/ ' + #numbers.formatDecimal(res.totalPago, 1, 2)}" style="font-weight: bold; color: var(--success-color);"></td>
                        <td>
                            <a th:href="@{/reservas/ver/{id}(id=${res.idReserva})}" class="btn btn-secondary btn-sm" style="margin-right: 0.5rem;">Ver Detalle</a>
                            <a th:href="@{/reportes/boleta/{id}(id=${res.idReserva})}" target="_blank" class="btn btn-primary btn-sm" style="background-color: #6F4E37; margin-right: 0.5rem;">Descargar PDF</a>
                            <a th:if="${usuario.rol.nombre == 'ADMINISTRADOR' || usuario.rol.nombre == 'RECEPCIONISTA'}" th:href="@{/reservas/eliminar/{id}(id=${res.idReserva})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Está seguro de eliminar esta reserva y restaurar el stock?')" style="background-color: var(--danger-color);">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>
</html>
