<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Café Origen - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=5)}">
    <link rel="icon" type="image/jpeg" th:href="@{/img/logo.jpeg}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4A3B32 0%, #2A2421 100%);
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-section h2 {
            font-size: 1.8rem;
            color: #6F4E37;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin: 0;
            text-decoration: none;
            border: none;
        }
        .logo-section p {
            color: #7E726B;
            font-size: 0.9rem;
            margin-top: 0.35rem;
            text-decoration: none;
            border: none;
        }
        .logo-section a,
        .logo-section a:link,
        .logo-section a:visited,
        .logo-section a:hover {
            color: #6F4E37;
            text-decoration: none !important;
            border: none;
        }
        .demo-credentials {
            margin-top: 1.5rem;
            background-color: #F5F5F0;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            border: 1px dashed #C0A080;
        }
        .demo-credentials strong {
            color: #6F4E37;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-section">
            <div class="brand-mark mx-auto mb-3" style="width:72px;height:72px;">
                <img th:src="@{/img/logo.jpeg}" alt="Café Origen" class="brand-logo">
            </div>
            <h2>CAFÉ ORIGEN</h2>
            <p>Especialidad &amp; Coworking</p>
        </div>


        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span>
        </div>
        <div th:if="${msg}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-check-circle-fill"></i><span th:text="${msg}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email" class="form-label">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" class="form-control" placeholder="nombre@cafeorigen.pe" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3" style="padding: 0.8rem;">
                <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar al Sistema
            </button>
        </form>

        <div class="demo-credentials mt-3">
            <p style="text-align: center; margin-bottom: 0.5rem; font-weight: bold; color: #6F4E37;">Cuentas de Acceso Rápido:</p>
            <p><strong>Administrador:</strong> admin@cafeorigen.pe | admin123</p>
            <p><strong>Recepcionista:</strong> sofia.recepcion@cafeorigen.pe | recepcion123</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
