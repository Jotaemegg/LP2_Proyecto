<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Origen - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4A3B32 0%, #2A2421 100%);
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-section h2 {
            font-size: 1.8rem;
            color: #6F4E37;
            font-weight: 700;
            letter-spacing: 1.5px;
        }
        .logo-section p {
            color: #7E726B;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        .demo-credentials {
            margin-top: 1.5rem;
            background-color: #F5F5F0;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            border: 1px dashed #C0A080;
        }
        .demo-credentials strong {
            color: #6F4E37;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-section">
            <h2>CAFÉ ORIGEN</h2>
            <p>Especialidad & Coworking</p>
        </div>

        <!-- Alertas de Error -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="nombre@cafeorigen.pe" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
                Ingresar al Sistema
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.2rem; margin-bottom: 0.5rem;">
            <a th:href="@{/registro}" style="color: #6F4E37; font-weight: 600; text-decoration: none; font-size: 0.9rem; transition: color 0.3s;" onmouseover="this.style.color='#C0A080'" onmouseout="this.style.color='#6F4E37'">
                ¿No tienes una cuenta? Regístrate aquí
            </a>
        </div>

        <div class="demo-credentials">
            <p style="text-align: center; margin-bottom: 0.5rem; font-weight: bold; color: #6F4E37;">Cuentas de Acceso Rápido:</p>
            <p><strong>Admin:</strong> admin@cafeorigen.pe | admin123</p>
            <p><strong>Recepcionista:</strong> juan.barista@cafeorigen.pe | barista123</p>
            <p><strong>Cliente:</strong> carlos@gmail.com | cliente123</p>
        </div>
    </div>

</body>
</html>
