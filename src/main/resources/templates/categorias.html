<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Café Origen - Mantenimiento de Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=5)}">
    <link rel="icon" type="image/jpeg" th:href="@{/img/logo.jpeg}">
    <th:block th:replace="~{fragments/navegacion :: navbarStyles}"></th:block>
</head>
<body>

    <header th:replace="~{fragments/navegacion :: headerAutenticado}"></header>

    <div class="container app-container py-4">

        <div th:replace="~{fragments/navegacion :: cardTop(@{/dashboard})}"></div>

        <div class="row g-4">

            <div class="col-lg-5">
                <div class="card">
                    <h2 class="card-title">
                        <i class="bi bi-tags me-2"></i>
                        <span th:text="${categoria.idCategoria == null ? 'Registrar Categoría' : 'Modificar Categoría'}">Registrar Categoría</span>
                    </h2>

                    <div th:if="${mensaje}" th:class="${cssmensaje}" th:text="${mensaje}"></div>

                    <form th:action="@{/categorias/grabar}" th:object="${categoria}" method="post">
                        <input type="hidden" th:field="*{idCategoria}">
                        <input type="hidden" th:field="*{estado}">

                        <div class="form-group">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <input type="text" id="descripcion" th:field="*{descripcion}" class="form-control"
                                   placeholder="Ej: Bebidas Calientes" required autocomplete="off">
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-save me-1"></i>Guardar
                            </button>
                            <a th:href="@{/categorias}" class="btn btn-secondary flex-fill text-center">
                                <i class="bi bi-plus-lg me-1"></i>Nuevo
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card">
                    <h2 class="card-title"><i class="bi bi-list-ul me-2"></i>Categorías Registradas</h2>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Descripción</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${lstCategorias}">
                                    <td th:text="${cat.idCategoria}">1</td>
                                    <td th:text="${cat.descripcion}" style="font-weight: 600; color: var(--primary-color);">Categoría</td>
                                    <td>
                                        <div class="d-flex flex-wrap gap-2">
                                            <a th:href="@{/categorias/editar/{id}(id=${cat.idCategoria})}" class="btn btn-secondary btn-sm">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:href="@{/categorias/eliminar/{id}(id=${cat.idCategoria})}" class="btn btn-danger btn-sm"
                                               onclick="return confirm('¿Dar de baja esta categoría?')">
                                                <i class="bi bi-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(lstCategorias)}">
                                    <td colspan="3" class="text-center text-cafe-muted">No hay categorías registradas.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
