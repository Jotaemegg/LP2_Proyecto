<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Origen - Salas & Mesas de Coworking</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
    <th:block th:replace="~{fragments/navegacion :: navbarStyles}"></th:block>
    <style>
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #F5F5F0;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }
        .filter-form {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .filter-form select {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: white;
            outline: none;
        }
    </style>
</head>
<body>

    <header th:replace="~{fragments/navegacion :: headerAutenticado}"></header>

    <div class="container">
        
        <div class="card">
            <div th:replace="~{fragments/navegacion :: cardTop(@{/dashboard})}"></div>
            <h2 class="card-title">Mantenimiento de Salas y Espacios Colaborativos</h2>
            
            <div class="filter-bar">
                <form th:action="@{/espacios}" method="get" class="filter-form">
                    <label for="tipo" style="font-weight: bold; color: var(--text-dark);">Filtrar por Tipo:</label>
                    <select id="tipo" name="tipo" onchange="this.form.submit()">
                        <option value="Todos" th:selected="${tipoSeleccionado == null || tipoSeleccionado == 'Todos'}">Todos los tipos</option>
                        <option value="Escritorio" th:selected="${tipoSeleccionado == 'Escritorio'}">Escritorio Individual</option>
                        <option value="Sala de reunion corporativa" th:selected="${tipoSeleccionado == 'Sala de reunion corporativa'}">Sala de Reunion Corporativa</option>
                        <option value="Salon" th:selected="${tipoSeleccionado == 'Salon'}">Salon de Eventos</option>
                    </select>
                </form>

                
                <a th:if="${usuario.rol.nombre == 'ADMINISTRADOR' || usuario.rol.nombre == 'RECEPCIONISTA'}" th:href="@{/espacios/nuevo}" class="btn btn-primary">
                    + Nuevo Espacio
                </a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Precio por Hora</th>
                        <th>Estado</th>
                        <th th:if="${usuario.rol.nombre == 'ADMINISTRADOR' || usuario.rol.nombre == 'RECEPCIONISTA'}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="esp : ${espacios}">
                        <td th:text="${esp.idEspacio}"></td>
                        <td th:text="${esp.nombre}" style="font-weight: bold; color: var(--primary-color);"></td>
                        <td th:text="${esp.tipo}"></td>
                        <td th:text="${'S/ ' + #numbers.formatDecimal(esp.precioHora, 1, 2)}"></td>
                        <td>
                            <span th:text="${esp.estado}" 
                                  th:classappend="${esp.estado == 'Disponible' ? 'badge-disponible badge' : (esp.estado == 'Ocupado' ? 'badge-ocupado badge' : 'badge-mantenimiento badge')}">
                            </span>
                        </td>
                        <td th:if="${usuario.rol.nombre == 'ADMINISTRADOR' || usuario.rol.nombre == 'RECEPCIONISTA'}">
                            <a th:href="@{/espacios/editar/{id}(id=${esp.idEspacio})}" class="btn btn-secondary btn-sm" style="margin-right: 0.5rem;">Editar</a>
                            <a th:if="${usuario.rol.nombre == 'ADMINISTRADOR'}" th:href="@{/espacios/eliminar/{id}(id=${esp.idEspacio})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Está seguro de eliminar este espacio?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>
</html>
