<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Origen - Formulario de Espacio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}">
    <th:block th:replace="~{fragments/navegacion :: navbarStyles}"></th:block>
</head>
<body>

    <header th:replace="~{fragments/navegacion :: headerAutenticado}"></header>

    <div class="container" style="max-width: 600px;">
        
        <div class="card">
            <div th:replace="~{fragments/navegacion :: cardTop(@{/espacios})}"></div>
            <h2 class="card-title" th:text="${espacio.idEspacio == null ? 'Registrar Nuevo Espacio' : 'Modificar Espacio'}"></h2>
            
            <form th:action="@{/espacios/guardar}" th:object="${espacio}" method="post">
                
                <!-- Campo oculto para el ID si es edición -->
                <input type="hidden" th:field="*{idEspacio}" />

                <div class="form-group">
                    <label for="nombre">Nombre del Espacio</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Ej: Sala de Cata - Cusco" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de Espacio</label>
                    <select id="tipo" th:field="*{tipo}" class="form-control" required>
                        <option value="Escritorio">Escritorio Individual</option>
                        <option value="Sala de reunion corporativa">Sala de Reunion Corporativa</option>
                        <option value="Salon">Salon de Eventos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="precioHora">Precio por Hora (S/)</label>
                    <input type="number" step="0.50" id="precioHora" th:field="*{precioHora}" class="form-control" placeholder="Ej: 15.00" min="1.00" required>
                </div>

                <div class="form-group">
                    <label for="estado">Estado Inicial</label>
                    <select id="estado" th:field="*{estado}" class="form-control" required>
                        <option value="Disponible">Disponible</option>
                        <option value="Ocupado">Ocupado</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar Cambios</button>
                    <a th:href="@{/espacios}" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancelar</a>
                </div>

            </form>
        </div>

    </div>

</body>
</html>
